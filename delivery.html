
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQUIPOS DELIVERY</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    
    <style>
        body { background-color: #f4f7f6; padding: 30px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .container-fluid { max-width: 1200px; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); background: white; }
        .table-header { background-color: #2c3e50 !important; color: white !important; }
        .badge-No Atiende { background-color: #0d6efd; color: white; padding: 5px 10px; border-radius: 8px; font-size: 0.8em; }
        .badge-n10 { background-color: #dc3545; color: white; padding: 5px 10px; border-radius: 8px; font-size: 0.8em; }
        h2 { color: #2c3e50; font-weight: 700; margin-bottom: 25px; }
    </style>
</head>
<body>
<a href="https://siccob-mex.github.io/zonasiccob"/> ZONA SICCOB</a>
<div class="container-fluid">
    <div class="card p-4">
        <h2 class="text-center">🏢 Consolidado NIVEL-10</h2>
        
        <table id="tablaMaestra" class="table table-hover w-100">
            <thead class="table-header">
                <tr>
                    <th>#</th>
                    <th>Sucursal</th>
                    <th>Estado</th>
                    <th>Tipo de Listado</th>
                    <th>Asignación</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

<script>
    // Datos combinados de ambas imágenes
    const dataset = [
        // Datos Imagen 1 (No Atiendees)
        [1, "--", "--", "--", "--"],
        
        
    ];

    $(document).ready(function() {
        $('#tablaMaestra').DataTable({
            data: dataset,
            columns: [
                { title: "#" },
                { title: "Sucursal" },
                { title: "IP" },
                { 
                    title: "EQUIPO",
                    render: function(data) {
                        let clase = data === 'General' ? 'badge-General' : 'badge-n10';
                        return `<span class="${clase}">${data}</span>`;
                    }
                },
                { title: "" }
            ],
            language: {
                url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json'
            },
            pageLength: 25,
            responsive: true
        });
    });
</script>

</body>
</html>
